<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Open Eval Standard</title>
  <desc id="desc">Write agent evals in YAML. Run them against any agent from any provider in any language.</desc>
  <rect width="400" height="220" rx="8" fill="#f8fafc"/>
  <g transform="translate(102 18) scale(.84)">
  <path d="M 22 14 C 38 8.5, 56 16.5, 67 10.5 Q 82.5 9.5, 80.5 26 C 84.5 42, 75.5 58, 81.5 71.5 Q 81.5 86.5, 64 83 C 49 88.5, 35 79.5, 21 85.5 Q 4.5 84.5, 9 67 C 3.5 51, 12.5 37, 6.5 26 Q 5.5 10.5, 22 14 Z" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
  <path d="M 27 49 L 39 61 L 62 35" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#0f172a">OES</text>
  <text x="102" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.4" fill="#64748b">Open Eval Standard</text>
  </g>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0f172a">
    <text x="200" y="130" font-size="23" font-weight="700">Write agent evals in YAML.</text>
    <text x="200" y="161" font-size="18">Run them against any agent from</text>
    <text x="200" y="185" font-size="18">any provider in any language.</text>
  </g>
</svg>
